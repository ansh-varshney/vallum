# App-wide promises, written once by the owner. Protected path. They feed the app-wide allowance.
service: vallum
promises:
  - id: app-available
    type: reliability
    says: "Fewer than 0.5% of all requests fail"
    measure: "error_rate(route='*') < 0.5%"
    where: [drive, live]
    severity: blocker
  - id: app-healthy
    type: operability
    says: "/health answers 200"
    steps: ["GET /health -> 200 contains ok"]
    where: [mr, drive, live]
    severity: blocker
  - id: app-tags-revision
    type: operability
    says: "Every response says which revision served it"
    steps: ["GET /health -> 200 header x-revision"]
    where: [mr, drive]
    severity: blocker
  - id: app-no-ip-logging
    type: data
    says: "Visitor IP addresses are never logged"
    static: {file_lacks: [app/telemetry.py, "client"]}
    where: [mr]
    severity: blocker
  - id: app-image-small
    type: cost
    says: "The app image stays under 250 MB, so deploys and cold starts stay quick and cheap"
    static: {image_below_mb: 250}
    where: [drive]
    severity: major
  - id: app-image-no-fixable-critical
    type: security
    says: "The app image has no critical vulnerability that already has a fix"
    scan: {report: container, max_severity: high, fixable_only: true}
    where: [drive]
    severity: blocker
