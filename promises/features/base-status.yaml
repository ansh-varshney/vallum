# Feature Card: the old status address. The status pages moved to their own site, the Vallum control room (a separate
# Cloud Run service, vallum-status, deployed by the control-room job); /status forwards there so old links keep working.
feature: status-page
issue: null
kind: ui-page
tier: standard
priority: P2
owns:
  routes: ["GET /status", "GET /status/{rest:path}"]
  files: [app/features/status.py]
flag: null
promises:
  behavior:
    - id: status-forwards
      says: "The old status address forwards to the control room"
      steps: ["GET /status -> 302 https://vallum-status-256944994567.us-central1.run.app/"]
      where: [mr, drive, live]
      severity: major
    - id: status-rules-forward
      says: "The old rules address forwards to the control room's rules"
      steps: ["GET /status/rules -> 302 https://vallum-status-256944994567.us-central1.run.app/rules"]
      where: [mr, drive, live]
      severity: minor
  speed:
    - id: status-fast
      says: "95% of status forwards finish in under 500 ms"
      measure: "p95(latency, route='GET /status') < 500ms"
      where: [mr, drive]
      severity: minor
  security:
    - id: status-no-secrets
      says: "The status forward never reads the secrets document"
      static: {file_lacks: [app/features/status.py, "vallum_secrets"]}
      where: [mr]
      severity: blocker
