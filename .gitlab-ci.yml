# Vallum: Day-1 platform checks.
# Temporary. Phase 1 replaces this file with the real pipeline.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never          # branch pipelines only, so MRs don't get duplicate pipelines
    - when: always

stages: [check]

variables:
  GCP_PROJECT_ID: "vallum-512306"
  GCP_PROJECT_NUMBER: "256944994567"
  GCP_REGION: "us-central1"
  GCP_WIF_PROVIDER: "projects/256944994567/locations/global/workloadIdentityPools/gitlab-pool/providers/gitlab-provider"
  GCP_DEPLOYER_SA: "vallum-deployer@vallum-512306.iam.gserviceaccount.com"
  GCP_APP_SA: "vallum-app@vallum-512306.iam.gserviceaccount.com"

.on_main_manual:
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE != "schedule"
      when: manual
  allow_failure: true

# Runs in every pipeline, so "Pipelines must succeed" has something to pass.
check:hello:
  stage: check
  image: alpine:3.20
  script:
    - echo "Vallum Day-1 checks. ref=$CI_COMMIT_REF_NAME source=$CI_PIPELINE_SOURCE user=$GITLAB_USER_LOGIN"

# Check 10: the owner token must exist on main and be absent on every other branch.
check:token-visibility:
  stage: check
  image: alpine:3.20
  script:
    - |
      if [ -n "${OWNER_TOKEN:-}" ]; then
        echo "OWNER_TOKEN is AVAILABLE here (ref=$CI_COMMIT_REF_NAME, protected=$CI_COMMIT_REF_PROTECTED)"
      else
        echo "OWNER_TOKEN is NOT available here (ref=$CI_COMMIT_REF_NAME, protected=$CI_COMMIT_REF_PROTECTED)"
      fi

# Check 6: shows when scheduled pipelines actually run.
check:scheduled:
  stage: check
  image: alpine:3.20
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  script:
    - echo "Scheduled pipeline ran at $(date -u +%FT%TZ)"

# Check 4: the owner token can open and merge an MR on main (the Merge Desk's core move).
check:merge:
  stage: check
  extends: .on_main_manual
  image: alpine:3.20
  before_script:
    - apk add --no-cache curl jq > /dev/null
  script:
    - |
      set -eu
      API="$CI_API_V4_URL/projects/$CI_PROJECT_ID"
      H="PRIVATE-TOKEN: $OWNER_TOKEN"
      BR="check/owner-merge-$CI_PIPELINE_ID"
      curl -sf -X POST -H "$H" "$API/repository/branches?branch=$BR&ref=main" > /dev/null
      jq -n --arg br "$BR" --arg id "$CI_PIPELINE_ID" \
        '{branch: $br, commit_message: "Day-1 check 4: owner-token merge",
          actions: [{action: "create", file_path: ("checks/merge-" + $id + ".txt"), content: ("Merged by the owner token in pipeline " + $id)}]}' > commit.json
      curl -sf -X POST -H "$H" -H "Content-Type: application/json" --data @commit.json "$API/repository/commits" > /dev/null
      MR=$(curl -sf -X POST -H "$H" "$API/merge_requests" \
        --data-urlencode "source_branch=$BR" --data-urlencode "target_branch=main" \
        --data-urlencode "title=Day-1 check 4: owner-token merge" --data "remove_source_branch=true" | jq -r .iid)
      echo "Opened MR !$MR; waiting for its pipeline (Pipelines must succeed is on)"
      for i in $(seq 1 60); do
        ST=$(curl -sf -H "$H" "$API/merge_requests/$MR" | jq -r '.head_pipeline.status // "none"')
        echo "  pipeline: $ST"
        [ "$ST" = "success" ] && break
        [ "$ST" = "failed" ] && { echo "MR pipeline failed"; exit 1; }
        sleep 10
      done
      SHA=$(curl -sf -H "$H" "$API/merge_requests/$MR" | jq -r .sha)
      curl -sf -X PUT -H "$H" "$API/merge_requests/$MR/merge?sha=$SHA&should_remove_source_branch=true" \
        | jq -r '"RESULT: MR !\(.iid) state=\(.state) merged_by=\(.merged_by.username)"'

# Check 5: the owner token can start a flow through the Flows API.
# Run it with the job variable HELLO_CONSUMER_ID set (from the AI Catalog step).
check:flows-api:
  stage: check
  extends: .on_main_manual
  image: alpine:3.20
  before_script:
    - apk add --no-cache curl jq > /dev/null
  script:
    - |
      set -eu
      : "${HELLO_CONSUMER_ID:?Set HELLO_CONSUMER_ID when you run this job}"
      jq -n --arg pid "$CI_PROJECT_ID" --argjson cid "$HELLO_CONSUMER_ID" \
        '{project_id: $pid, ai_catalog_item_consumer_id: $cid, start_workflow: true, environment: "ambient", issue_id: 1,
          goal: "Day-1 check 5: started through the Flows API from a main pipeline. Post your hello comment on issue 1."}' > body.json
      CODE=$(curl -s -o resp.json -w "%{http_code}" -X POST -H "PRIVATE-TOKEN: $OWNER_TOKEN" \
        -H "Content-Type: application/json" --data @body.json "$CI_API_V4_URL/ai/duo_workflows/workflows")
      echo "HTTP $CODE"
      jq '{id, status, workflow_definition, web_url: (.web_url // null), message: (.message // null)}' resp.json || cat resp.json

# Check 8: keyless login to Google Cloud, deploy, private tag URL, 90/10 traffic split.
check:cloud-run:
  stage: check
  extends: .on_main_manual
  image: google/cloud-sdk:slim
  id_tokens:
    GCP_ID_TOKEN:
      aud: https://iam.googleapis.com/projects/256944994567/locations/global/workloadIdentityPools/gitlab-pool/providers/gitlab-provider
  script:
    - echo "$GCP_ID_TOKEN" > /tmp/oidc_token
    - gcloud iam workload-identity-pools create-cred-config "$GCP_WIF_PROVIDER" --service-account="$GCP_DEPLOYER_SA" --credential-source-file=/tmp/oidc_token --output-file=/tmp/cred.json
    - gcloud auth login --cred-file=/tmp/cred.json --quiet
    - gcloud config set project "$GCP_PROJECT_ID"
    - gcloud run deploy vallum-check --image=us-docker.pkg.dev/cloudrun/container/hello --region="$GCP_REGION" --service-account="$GCP_APP_SA" --allow-unauthenticated --min-instances=0 --max-instances=1 --quiet
    - gcloud run deploy vallum-check --image=us-docker.pkg.dev/cloudrun/container/hello --region="$GCP_REGION" --service-account="$GCP_APP_SA" --no-traffic --tag=cand --update-env-vars="CHECK_RUN=$CI_PIPELINE_ID" --quiet
    - gcloud run services update-traffic vallum-check --region="$GCP_REGION" --to-tags=cand=10 --quiet
    - gcloud run services describe vallum-check --region="$GCP_REGION" --format="yaml(status.url,status.traffic)"

# Check 9: Firestore emulator inside a CI job, with no cloud credentials (how MR tests will run).
check:emulator:
  stage: check
  image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
  rules:
    - when: manual
  allow_failure: true
  script:
    - gcloud emulators firestore start --host-port=127.0.0.1:8080 > /tmp/emulator.log 2>&1 &
    - for i in $(seq 1 45); do curl -s 127.0.0.1:8080 > /dev/null && break; sleep 2; done
    - >
      curl -s -X POST "http://127.0.0.1:8080/v1/projects/vallum-test/databases/(default)/documents/checks?documentId=day1"
      -H "Content-Type: application/json" -d '{"fields":{"hello":{"stringValue":"world"}}}' > /dev/null
    - curl -s "http://127.0.0.1:8080/v1/projects/vallum-test/databases/(default)/documents/checks/day1" | grep -q '"world"' && echo "write/read OK"
