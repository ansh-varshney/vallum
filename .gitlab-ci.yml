# Vallum pipelines. Protected path: the Gatekeeper refuses agent changes to this file (rule 5),
# and the deploy provenance gate refuses to deploy anything that skipped these jobs.
#
#   MR pipelines (no tokens, no cloud):  unit tests · promise checker on localhost · SAST · secrets · Gatekeeper report
#   main push / API pipelines:           provenance gate · unit tests · scans · build image · test drive · Merge Desk
#   main schedule / web pipelines:       Live Patrol (Watchdog, Ledger) · Merge Desk
#   any main pipeline:                   rollback-now (manual, needs no variables)

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"
      when: never
    - if: $CI_COMMIT_BRANCH

stages: [gate, test, report, build, drive, desk]

variables:
  GCP_PROJECT_ID: "vallum-512306"
  GCP_PROJECT_NUMBER: "256944994567"
  GCP_REGION: "us-central1"
  GCP_WIF_PROVIDER: "projects/256944994567/locations/global/workloadIdentityPools/gitlab-pool/providers/gitlab-provider"
  GCP_DEPLOYER_SA: "vallum-deployer@vallum-512306.iam.gserviceaccount.com"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  AST_ENABLE_MR_PIPELINES: "true"
  SAST_EXCLUDED_PATHS: "tests, .cache"

include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml

.if_mr: &if_mr
  if: $CI_PIPELINE_SOURCE == "merge_request_event"
.if_release: &if_release
  if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && ($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "api")
.if_ops: &if_ops
  if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && ($CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web")
.if_branch: &if_branch
  if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"

.python:
  image: python:3.12-slim
  cache:
    key: pip-v1
    paths: [.cache/pip]
  before_script:
    - pip install -q --disable-pip-version-check -r requirements.txt -r requirements-vallum.txt

.gcp:
  id_tokens:
    GCP_ID_TOKEN:
      aud: https://iam.googleapis.com/projects/256944994567/locations/global/workloadIdentityPools/gitlab-pool/providers/gitlab-provider

# ---------------------------------------------------------------- gate
provenance-gate:
  stage: gate
  extends: [.python, .gcp]
  rules: [*if_release]
  needs: []
  script:
    - python -m vallum.gate.provenance
  artifacts:
    reports:
      dotenv: reports/provenance.env

# Publishes .gitlab/duo/flows/*.yaml to the AI Catalog and enables them here (flows as code).
flows-sync:
  stage: gate
  extends: [.python, .gcp]
  rules:
    - <<: *if_release
      changes: [.gitlab/duo/flows/**/*, vallum/flows/**/*]
    - <<: *if_ops
      when: manual
  needs:
    - { job: provenance-gate, optional: true }
  allow_failure: true
  script:
    - python -m vallum.flows sync

# ---------------------------------------------------------------- test
unit-tests:
  stage: test
  extends: .python
  rules: [*if_mr, *if_release, *if_branch]
  needs: []
  script:
    - pytest --junitxml=reports/junit.xml
  artifacts:
    when: always
    reports:
      junit: reports/junit.xml

promise-checker:
  stage: test
  extends: .python
  rules: [*if_mr]
  needs: []
  services:
    - name: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
      alias: firestore
      command: ["gcloud", "emulators", "firestore", "start", "--host-port=0.0.0.0:8080"]
  variables:
    FIRESTORE_EMULATOR_HOST: "firestore:8080"
    GOOGLE_CLOUD_PROJECT: "vallum-test"
  script:
    - python -m vallum.checker --out reports/checker.json
  artifacts:
    when: always
    paths: [reports/]

semgrep-sast:
  rules: [*if_mr, *if_release]
  artifacts:
    when: always
    paths: [gl-sast-report.json]

secret_detection:
  rules: [*if_mr, *if_release]
  artifacts:
    when: always
    paths: [gl-secret-detection-report.json]

# ---------------------------------------------------------------- report (MR only, no powers)
gatekeeper-report:
  stage: report
  extends: .python
  rules:
    - <<: *if_mr
      when: always          # report all 12 rules even when the checker failed
  needs:
    - promise-checker
    - { job: semgrep-sast, optional: true }
    - { job: secret_detection, optional: true }
  script:
    - python -m vallum.gate report --out reports/gatekeeper.json
  artifacts:
    when: always
    paths: [reports/gatekeeper.json]

# ---------------------------------------------------------------- build
build-image:
  stage: build
  extends: .gcp
  image: docker:27
  services: [docker:27-dind]
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  rules:
    - <<: *if_release
      changes: [app/**/*, Dockerfile, requirements.txt, deploy/**/*]
  needs: [provenance-gate, unit-tests]
  script:
    - apk add --no-cache curl jq > /dev/null
    - TOKEN=$(sh vallum/drive/gcp-token.sh)
    - echo "$TOKEN" | docker login -u oauth2accesstoken --password-stdin "https://${GCP_REGION}-docker.pkg.dev"
    - TAG="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/vallum/app:${CI_COMMIT_SHA}"
    - docker build --pull -t "$TAG" .
    - docker push "$TAG"
    - DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$TAG")
    - SIZE=$(docker image inspect "$TAG" --format='{{.Size}}')
    - mkdir -p reports
    - echo "IMAGE=$DIGEST" > reports/build.env
    - echo "{\"image\":\"$DIGEST\",\"image_bytes\":$SIZE}" > reports/build.json
    - echo "Built $DIGEST ($((SIZE / 1000000)) MB)"
  artifacts:
    paths: [reports/build.json]
    reports:
      dotenv: reports/build.env

# ---------------------------------------------------------------- drive
test-drive:
  stage: drive
  extends: [.python, .gcp]
  resource_group: release
  timeout: 45m
  rules: [*if_release]
  needs:
    - provenance-gate
    - { job: build-image, optional: true }
  environment:
    name: production
    url: https://vallum-256944994567.us-central1.run.app/status
  script:
    - python -m vallum.drive release
  artifacts:
    when: always
    paths: [reports/]

rollback-now:
  stage: drive
  extends: [.python, .gcp]
  rules:
    - <<: *if_release
      when: manual
    - <<: *if_ops
      when: manual
  allow_failure: true
  needs: []
  script:
    - python -m vallum.drive rollback-now

live-patrol:
  stage: drive
  extends: [.python, .gcp]
  rules: [*if_ops]
  needs: []
  timeout: 20m                   # live checks, 30 s of visitors, resuming paused work, @vallum commands
  script:
    - python -m vallum.patrol

# ---------------------------------------------------------------- desk
merge-desk:
  stage: desk
  extends: [.python, .gcp]
  resource_group: release
  timeout: 30m
  rules:
    - <<: *if_release
      when: always
    - *if_ops
  needs:
    - { job: test-drive, optional: true }
  script:
    - python -m vallum.desk
